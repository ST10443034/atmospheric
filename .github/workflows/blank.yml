name: Android CI

# Builds the app, runs lint + unit tests, and publishes the reports and debug APK
# on every push/PR to main, and for any tag (e.g. the final PoE tag).
on:
  push:
    branches: [ main ]
    tags: [ '*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build (compile + lint + unit tests)
        run: ./gradlew build
      - name: Run unit tests
        run: ./gradlew test
      - name: Assemble debug APK
        run: ./gradlew assembleDebug
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: atmospheric-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
